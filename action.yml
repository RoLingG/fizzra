name: 'Fizzra'
description: 'Scan a repository for code quality issues and fail the build when the quality gate is not met.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory to scan, relative to the workspace root.'
    required: false
    default: '.'
  analyzers:
    description: 'Comma separated analyzer names to run. Empty runs everything applicable to the detected language.'
    required: false
    default: ''
  fail-on:
    description: >-
      Comma separated severities that fail the gate. Valid: critical, error,
      warning. Empty keeps whatever fizzra.yaml and the dashboard already
      configure, so this does not silently override a project's own thresholds.
    required: false
    default: ''
  min-score:
    description: 'Override the minimum score. Empty uses the value from fizzra.yaml or the built-in default.'
    required: false
    default: ''
  allow-skipped:
    description: >-
      Exit 0 when the only reason the scan is incomplete is that an analyzer's
      tool is not installed. Analyzers that crashed or timed out still fail the
      run. Defaults to false so a missing toolchain cannot silently pass.
    required: false
    default: false
  reports:
    description: >-
      Comma separated report formats to produce: sarif, json, html. Every one
      of them is attached to a single artifact, generated from the same scan.
      Empty writes no file and only prints the summary to the job log.
    required: false
    default: 'sarif'
  version:
    description: >-
      Fizzra release to download. Defaults to latest. Pin a tag in CI so an
      upstream release cannot change your pipeline's behaviour overnight.
    required: false
    default: 'latest'
  upload-sarif:
    description: >-
      Upload the SARIF report with codeql-action/upload-sarif so findings appear
      as inline annotations. Requires sarif to be listed in `reports` and the
      caller to grant security-events: write. GitHub only accepts these uploads
      for public repositories and for private ones on a plan with GitHub
      Advanced Security; elsewhere the step fails but is marked
      continue-on-error, so the scan itself still gates the build.
    required: false
    default: true

outputs:
  score:
    description: 'The overall score, 0-100.'
    value: ${{ steps.scan.outputs.score }}
  gate:
    description: 'passed or failed.'
    value: ${{ steps.scan.outputs.gate }}
  project:
    description: 'The name the scanned directory was registered under.'
    value: ${{ steps.scan.outputs.project }}

runs:
  using: 'composite'
  steps:
    - name: Download Fizzra
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   asset=fizzra-linux-amd64 ;;
          Windows-X64) asset=fizzra-windows-amd64.exe ;;
          *)
            echo "::error::Fizzra has no release for $RUNNER_OS-$RUNNER_ARCH. Build it from source or run it inside a container."
            exit 1
            ;;
        esac

        # github.action_repository and github.action_ref are empty inside a
        # composite action: a step owned by the action cannot see where the
        # action came from. Interpolating them gives "https://github.com//"
        # and a 404, so the repository path is spelled out here and only the
        # host is taken from the environment, which is also right on GHES.
        server="${GITHUB_SERVER_URL:-https://github.com}"
        if [ "$INPUT_VERSION" = latest ]; then
          url="$server/RoLingG/fizzra/releases/latest/download/$asset"
        else
          url="$server/RoLingG/fizzra/releases/download/$INPUT_VERSION/$asset"
        fi

        echo "Downloading $url"

        # Always install as `fizzra` so later steps call the same command on
        # both platforms instead of the release's asset name.
        bindir="$RUNNER_TEMP/fizzra"
        mkdir -p "$bindir"
        cmd="$bindir/fizzra"
        if [ "$RUNNER_OS" = Windows ]; then cmd="$cmd.exe"; fi

        curl -fsSL --retry 3 -o "$cmd" "$url"
        chmod +x "$cmd"

        # GITHUB_PATH only affects later steps, so the version check below uses
        # the absolute path rather than relying on PATH.
        echo "$bindir" >> "$GITHUB_PATH"
        echo "::group::fizzra version"
        "$cmd" version
        echo "::endgroup::"

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ANALYZERS: ${{ inputs.analyzers }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
      run: |
        set -euo pipefail

        # Reports are written by the next step from the stored analysis, so this
        # one only needs the gate outcome. text keeps the CLI from opening a file
        # it would then have to clean up.
        args=(ci "$INPUT_PATH" --format text --print-project)

        # `if` rather than `[ ... ] && cmd`: under `set -e` a false test makes
        # the whole line return 1 and aborts the step.
        if [ -n "$INPUT_ANALYZERS" ]; then args+=(--analyzers "$INPUT_ANALYZERS"); fi
        if [ -n "$INPUT_FAIL_ON" ]; then args+=(--fail-on "$INPUT_FAIL_ON"); fi
        if [ -n "$INPUT_MIN_SCORE" ]; then args+=(--min-score "$INPUT_MIN_SCORE"); fi
        # 布尔 input 传到 shell 时是字符串，大小写和形式不保证跨版本一致，
        # 所以按 true/True/1 都认
        case "$INPUT_ALLOW_SKIPPED" in
          true|True|TRUE|1) args+=(--allow-skipped) ;;
        esac

        # Capture the summary so the workflow log carries the score even when
        # the gate fails; the step's own exit code still decides the outcome.
        # 2>&1 keeps the `project:` line and the analyzer log in one file.
        set +e
        fizzra "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/fizzra/scan.log"
        code=${PIPESTATUS[0]}
        set -e

        # Values come from the `fizzra-summary:` line, whose field names are a
        # contract. Parsing the human-readable table instead would break the
        # moment its spacing changes.
        summary=$(grep '^fizzra-summary: ' "$RUNNER_TEMP/fizzra/scan.log" | head -1)
        field() { echo "$summary" | sed -n "s/.*[ ]$1=\([^ ]*\).*/\1/p"; }

        score=$(field score)
        gate=$(field gate)
        proj=$(field project)
        reason=$(field reason)

        if [ -n "$score" ]; then echo "score=$score" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$gate" ]; then echo "gate=$gate" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$proj" ]; then echo "project=$proj" >> "$GITHUB_OUTPUT"; fi

        if [ "$code" -ne 0 ]; then
          case "$reason" in
            analyzer-failed)
              echo "::error::Fizzra could not complete: one or more analyzers crashed or timed out. See the log above."
              ;;
            nothing-checked)
              echo "::error::Fizzra checked nothing: every analyzer was skipped. Install the missing tools or narrow --analyzers."
              ;;
            incomplete)
              echo "::error::Fizzra quality gate failed on a partial scan."
              ;;
            *)
              echo "::error::Fizzra quality gate failed. Review the summary above and the report artefact."
              ;;
          esac
        fi
        exit "$code"

    # Writes every requested format into one directory so a single artifact
    # carries all of them. Runs even when the gate failed, since a red build is
    # exactly when the reports matter. `report --project` reuses the analysis
    # the step above just wrote instead of scanning again.
    - name: Collect reports
      if: always() && inputs.reports != ''
      shell: bash
      env:
        INPUT_REPORTS: ${{ inputs.reports }}
        INPUT_PROJECT: ${{ steps.scan.outputs.project }}
      run: |
        set -euo pipefail

        outdir="$RUNNER_TEMP/fizzra/reports"
        mkdir -p "$outdir"

        # 用扫描时实际注册的名字，而不是目录名：目录同名时注册名会被追加哈希，
        # 用目录名取报告会拿到另一个项目
        proj="$INPUT_PROJECT"
        if [ -z "$proj" ]; then
          echo "::warning::the scan did not report a project name, no report written"
          exit 0
        fi

        # A failure here must not mask the gate result, so each report is best
        # effort and the step never turns a red gate green.
        for fmt in $(echo "$INPUT_REPORTS" | tr ',' ' '); do
          case "$fmt" in
            sarif) dest="$outdir/fizzra.sarif" ;;
            json)  dest="$outdir/fizzra.json" ;;
            html)  dest="$outdir/fizzra-report.html" ;;
            *) echo "::warning::unknown format '$fmt' in reports, skipped"; continue ;;
          esac

          echo "::group::report $fmt"
          if fizzra report --project "$proj" --format "$fmt" --output "$dest"; then
            echo "wrote $dest"
          else
            echo "::warning::could not write the $fmt report"
          fi
          echo "::endgroup::"
        done

    # One artifact holds every report the scan produced.
    - name: Upload reports
      if: always() && inputs.reports != ''
      uses: actions/upload-artifact@v6
      with:
        name: fizzra-reports
        path: ${{ runner.temp }}/fizzra/reports
        retention-days: 14
      continue-on-error: true

    # Uploaded before failing so the annotations are available precisely when
    # the gate is red. `if: always()` is what makes that ordering work.
    # Separate from the artifact above: this one feeds GitHub's code scanning,
    # it does not produce a downloadable file. Points at the copy Collect
    # reports just wrote, not the workspace: the scan itself no longer leaves a
    # SARIF file behind.
    - name: Upload SARIF
      if: always() && inputs.upload-sarif && contains(inputs.reports, 'sarif')
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/fizzra/reports/fizzra.sarif
        category: fizzra
      continue-on-error: true
