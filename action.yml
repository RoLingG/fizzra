name: 'Fizzra'
description: 'Scan a repository for code quality issues and fail the build when the quality gate is not met.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Directory to scan, relative to the workspace root.'
    required: false
    default: '.'
  analyzers:
    description: 'Comma separated analyzer names to run. Empty runs everything applicable to the detected language.'
    required: false
    default: ''
  fail-on:
    description: 'Comma separated severities that fail the gate: critical, error, warning.'
    required: false
    default: 'critical,error'
  min-score:
    description: 'Override the minimum score. Empty uses the value from fizzra.yaml or the built-in default.'
    required: false
    default: ''
  allow-skipped:
    description: >-
      Exit 0 when the only reason the scan is incomplete is that an analyzer's
      tool is not installed. Analyzers that crashed or timed out still fail the
      run. Defaults to false so a missing toolchain cannot silently pass.
    required: false
    default: 'false'
  format:
    description: 'Report format: sarif, json, html or text.'
    required: false
    default: 'sarif'
  extra-formats:
    description: >-
      Additional formats to write after the scan, comma separated from sarif,
      json, html. The main `format` still decides the gate and the SARIF
      upload; these are generated from the same analysis and attached as a
      single artifact, so producing all three costs one scan, not three.
    required: false
    default: ''
  output:
    description: >-
      Report path. Defaults to fizzra.sarif for sarif, fizzra.json for json
      and fizzra-report.html for html. Ignored for text.
    required: false
    default: ''
  version:
    description: >-
      Fizzra release to download. Defaults to latest. Pin a tag in CI so an
      upstream release cannot change your pipeline's behaviour overnight.
    required: false
    default: 'latest'
  upload-sarif:
    description: >-
      Upload the SARIF report with codeql-action/upload-sarif so findings appear
      as inline annotations. Requires the caller to grant security-events: write.
      GitHub only accepts these uploads for public repositories and for private
      ones on a plan with GitHub Advanced Security; elsewhere the step fails but
      is marked continue-on-error, so the scan itself still gates the build.
    required: false
    default: 'true'

outputs:
  score:
    description: 'The overall score, 0-100.'
    value: ${{ steps.scan.outputs.score }}
  gate:
    description: 'passed or failed.'
    value: ${{ steps.scan.outputs.gate }}
  report-path:
    description: 'Where the report was written.'
    value: ${{ steps.scan.outputs.report-path }}
  project:
    description: 'The name the scanned directory was registered under.'
    value: ${{ steps.scan.outputs.project }}

runs:
  using: 'composite'
  steps:
    - name: Download Fizzra
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   asset=fizzra-linux-amd64 ;;
          Windows-X64) asset=fizzra-windows-amd64.exe ;;
          *)
            echo "::error::Fizzra has no release for $RUNNER_OS-$RUNNER_ARCH. Build it from source or run it inside a container."
            exit 1
            ;;
        esac

        # github.action_repository is not reliable inside a composite action --
        # it reflects the caller's context, not this action's own repository,
        # and resolves to the wrong path (or nothing) when the action is
        # referenced by another repo. GITHUB_SERVER_URL is a plain env var and
        # is correct everywhere, so only the host is taken from the context and
        # the repository path is spelled out.
        server="${GITHUB_SERVER_URL:-https://github.com}"
        if [ "$INPUT_VERSION" = latest ]; then
          url="$server/RoLingG/fizzra/releases/latest/download/$asset"
        else
          url="$server/RoLingG/fizzra/releases/download/$INPUT_VERSION/$asset"
        fi

        echo "Downloading $url"

        # Always install as `fizzra` so later steps call the same command on
        # both platforms instead of the release's asset name.
        bindir="$RUNNER_TEMP/fizzra"
        mkdir -p "$bindir"
        cmd="$bindir/fizzra"
        if [ "$RUNNER_OS" = Windows ]; then cmd="$cmd.exe"; fi

        curl -fsSL --retry 3 -o "$cmd" "$url"
        chmod +x "$cmd"

        # GITHUB_PATH only affects later steps, so the version check below uses
        # the absolute path rather than relying on PATH.
        echo "$bindir" >> "$GITHUB_PATH"
        echo "::group::fizzra version"
        "$cmd" version || true
        echo "::endgroup::"

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ANALYZERS: ${{ inputs.analyzers }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail

        args=(ci "$INPUT_PATH" --format "$INPUT_FORMAT" --print-project)

        case "$INPUT_FORMAT" in
          sarif) default_out=fizzra.sarif ;;
          json)  default_out=fizzra.json ;;
          html)  default_out=fizzra-report.html ;;
          text)  default_out= ;;
        esac
        out="${INPUT_OUTPUT:-$default_out}"
        if [ -n "$out" ]; then
          args+=(--output "$out")
        fi

        # `if` rather than `[ ... ] && cmd`: under `set -e` a false test makes
        # the whole line return 1 and aborts the step.
        if [ -n "$INPUT_ANALYZERS" ]; then args+=(--analyzers "$INPUT_ANALYZERS"); fi
        if [ -n "$INPUT_FAIL_ON" ]; then args+=(--fail-on "$INPUT_FAIL_ON"); fi
        if [ -n "$INPUT_MIN_SCORE" ]; then args+=(--min-score "$INPUT_MIN_SCORE"); fi
        if [ "$INPUT_ALLOW_SKIPPED" = true ]; then args+=(--allow-skipped); fi

        # Only advertise a path when one was actually written
        if [ -n "$out" ]; then
          echo "report-path=$out" >> "$GITHUB_OUTPUT"
        fi

        # Capture the summary so the workflow log carries the score even when
        # the gate fails; the step's own exit code still decides the outcome.
        # 2>&1 keeps the `project:` line and the analyzer log in one file.
        set +e
        fizzra "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/fizzra/scan.log"
        code=${PIPESTATUS[0]}
        set -e

        score=$(sed -n 's/^ *Score *\([0-9.]*\)\/100.*/\1/p' "$RUNNER_TEMP/fizzra/scan.log" | head -1)
        gate=$(sed -n 's/^ *Result *\([A-Za-z]*\).*/\1/p' "$RUNNER_TEMP/fizzra/scan.log" | head -1 | tr '[:upper:]' '[:lower:]')
        # 项目名不一定是目录名，重名时会被追加哈希，后续步骤靠这个名字取报告
        proj=$(sed -n 's/^project: //p' "$RUNNER_TEMP/fizzra/scan.log" | head -1)
        echo "score=${score}" >> "$GITHUB_OUTPUT"
        echo "gate=${gate}" >> "$GITHUB_OUTPUT"
        echo "project=${proj}" >> "$GITHUB_OUTPUT"

        if [ "$code" -ne 0 ]; then
          echo "::error::Fizzra quality gate failed. Review the summary above and the report artefact."
        fi
        exit "$code"

    # Runs even when the gate failed, so a red build still yields the same
    # reports a green one would. `report --project` reuses the analysis the step
    # above just wrote instead of scanning again.
    - name: Write extra report formats
      if: always() && inputs.extra-formats != ''
      shell: bash
      env:
        INPUT_EXTRA: ${{ inputs.extra-formats }}
        INPUT_PROJECT: ${{ steps.scan.outputs.project }}
      run: |
        set -euo pipefail

        mkdir -p "$RUNNER_TEMP/fizzra/reports"

        # 用扫描时实际注册的名字，而不是目录名：目录同名时注册名会被追加哈希，
        # 用目录名取报告会拿到另一个项目
        proj="$INPUT_PROJECT"
        if [ -z "$proj" ]; then
          echo "::warning::the scan did not report a project name, skipping extra formats"
          exit 0
        fi

        # A failure here must not mask the gate result, so each report is best
        # effort and the step never turns a red gate green.
        for fmt in $(echo "$INPUT_EXTRA" | tr ',' ' '); do
          case "$fmt" in
            json) dest="$RUNNER_TEMP/fizzra/reports/fizzra.json" ;;
            html) dest="$RUNNER_TEMP/fizzra/reports/fizzra-report.html" ;;
            sarif) dest="$RUNNER_TEMP/fizzra/reports/fizzra.sarif" ;;
            *) echo "::warning::unknown format '$fmt' in extra-formats, skipped"; continue ;;
          esac

          echo "::group::report $fmt"
          if fizzra report --project "$proj" --format "$fmt" --output "$dest"; then
            echo "wrote $dest"
          else
            echo "::warning::could not write the $fmt report"
          fi
          echo "::endgroup::"
        done

    - name: Upload reports
      if: always() && inputs.extra-formats != ''
      uses: actions/upload-artifact@v6
      with:
        name: fizzra-reports
        path: ${{ runner.temp }}/fizzra/reports
        retention-days: 14
      continue-on-error: true

    # Uploaded before failing so the annotations are available precisely when
    # the gate is red. `if: always()` is what makes that ordering work.
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.output != '' && inputs.output || 'fizzra.sarif' }}
        category: fizzra
      continue-on-error: true

    - name: Upload HTML report
      if: always() && inputs.format == 'html'
      uses: actions/upload-artifact@v6
      with:
        name: fizzra-report
        path: ${{ inputs.output != '' && inputs.output || 'fizzra-report.html' }}
        retention-days: 14
      continue-on-error: true
