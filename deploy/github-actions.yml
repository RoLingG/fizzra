# Fizzra 代码质量检查 — 复制本文件到 .github/workflows/fizzra.yml
#
# 让它在你的仓库里跑起来，只需要做两件事：
#
#   1. 把不是你这个语言的部分删掉（下面每个语言都是独立一块，留你自己的）
#   2. 如果是 Go 项目，确认 go.mod 里的版本和 runner 能装到的一致
#
# Fizzra 那一步不用改，它自己下载二进制、跑扫描、门禁不过就让构建失败。
# 某个语言的分析器工具没装，只会记为「跳过」，不会让构建失败——你依然能得到一个分数，只是检查项少一些。

name: Code quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # SARIF 上传需要。只有想看代码扫描里的行内标注时才必要。
  security-events: write

jobs:
  fizzra:
    name: Fizzra
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # ---------------------------------------------------------------
      # 一、语言运行时
      #
      # 只需要你那个语言的 setup。其余的删掉。
      # ---------------------------------------------------------------

      # Go：装 go.mod 声明的版本。版本低于 go.mod 时 go vet 会拒绝运行。
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Python：
      # - uses: actions/setup-python@v6
      #   with:
      #     python-version: '3.12'

      # Node：
      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: '22'

      # Rust：
      # - uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------------
      # 二、linter 本身
      #
      # setup 只装语言，不装 linter。少了这一步，对应的分析器会被跳过，
      # 而不是失败。同样只留你那个语言的块。
      # ---------------------------------------------------------------

      - name: 安装 Go 分析器
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # - name: 安装 Python 分析器
      #   run: pip install ruff

      # - name: 安装 JS 分析器
      #   run: npm i -g oxlint @biomejs/biome

      # - name: 安装 Rust 分析器
      #   run: |
      #     rustup component add clippy rustfmt
      #     cargo install cargo-audit --locked

      # ---------------------------------------------------------------
      # 三、Fizzra
      #
      # 只有这一步是必须的。action 会下载对应平台的二进制、放进 PATH、
      # 跑一次扫描，门禁不过就让这个 job 失败。报告会作为 artifact 保留，
      # 门禁失败时也照样产出。
      # ---------------------------------------------------------------

      - uses: RoLingG/fizzra@v0.1.8
        id: scan
        with:
          # 哪些严重级会让构建失败。默认 critical,error；想更严可以加
          # warning，或者改用 min-score 按总分卡。
          fail-on: critical,error
          # sarif 供 GitHub 代码扫描用；可选 json 和 html，默认只有 sarif，
          # 需要下载文件再加后面两个。
          reports: sarif
          # 和上面 uses 的 tag 保持一致。写成 latest 则每次都取最新版，
          # 但上游一改你的流水线行为就跟着变，CI 里建议钉死 tag。
          version: v0.1.8

      # 可选：把分数写进 job 摘要页。
      - name: 结果摘要
        if: always()
        run: |
          echo "### Fizzra：${{ steps.scan.outputs.gate }}" >> "$GITHUB_STEP_SUMMARY"
          echo "得分：${{ steps.scan.outputs.score }}" >> "$GITHUB_STEP_SUMMARY"


