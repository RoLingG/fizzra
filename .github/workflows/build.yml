name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: |
          # gofmt -l prints files that need formatting; any output is a failure.
          unformatted=$(gofmt -l ./backend)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./backend/...

      - name: Build (no dashboard)
        run: go build -o /tmp/fizzra ./backend/cmd/fizzra

      - name: Smoke test the binary
        run: |
          /tmp/fizzra version
          /tmp/fizzra analyzers
          # Scanning this repository must succeed and produce a report.
          /tmp/fizzra scan ./backend --quiet
          /tmp/fizzra report --project backend --format json --output /tmp/report.json
          test -s /tmp/report.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and verify
        run: npm run build

      - name: Verify the assets landed in the embed directory
        run: test -f ../backend/internal/web/dist/index.html

  release:
    name: Release binary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build the dashboard
        run: go generate ./backend/internal/web/...

      - name: Build the self-contained binaries
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X github.com/rolingg/fizzra/backend/internal/service.Version=${VERSION}"
          # The dashboard dist is embedded, so it is built once and shared by
          # both targets: go:embed reads from the source tree, not the target OS.
          #
          # CGO is off on purpose. The SQLite driver is pure Go (modernc), so
          # nothing needs it, and leaving it on makes the Windows cross-build
          # try to compile the Linux cgo runtime with whatever host gcc is
          # around. On a Linux runner that happens to work; on a machine with a
          # Windows-targeted gcc it fails on missing <sys/mman.h> and friends.
          export CGO_ENABLED=0
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o fizzra-linux-amd64 ./backend/cmd/fizzra
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o fizzra-windows-amd64.exe ./backend/cmd/fizzra
          ./fizzra-linux-amd64 version

      - uses: actions/upload-artifact@v4
        with:
          name: fizzra-linux-amd64
          path: fizzra-linux-amd64
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: fizzra-windows-amd64
          path: fizzra-windows-amd64.exe
          retention-days: 30

      - name: Verify the binary serves a dashboard
        run: |
          ./fizzra-linux-amd64 serve --port 18080 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18080/healthz > /dev/null; then break; fi
            sleep 0.5
          done

          curl -sf http://127.0.0.1:18080/healthz
          # The index must be the real dashboard, not the "not built" placeholder.
          curl -sf http://127.0.0.1:18080/ | grep -q '<div id="app">'
          curl -sf http://127.0.0.1:18080/api/v1/system/info | grep -q '"version"'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fizzra-linux-amd64
            fizzra-windows-amd64.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
